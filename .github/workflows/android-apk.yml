name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: bun install

    - name: Install Capacitor
      run: |
        bun add @capacitor/core @capacitor/android
        bun add -d @capacitor/cli

    - name: Build Web App
      run: |
        bunx prisma generate || true
        bunx next build

    - name: Initialize Capacitor
      run: |
        bunx cap init "Fuel Track" "com.fueltrack.app" --web-dir out
        
    - name: Add Android Platform
      run: |
        bunx cap add android

    - name: Generate Native Icons
      run: |
        bun add -d @capacitor/assets
        mkdir -p assets
        cp public/icons/icon-512.png assets/icon.png || echo "Icon not found, skipping"
        bunx @capacitor/assets generate --iconBackgroundColor '#0a0e13' --iconBackgroundColorDark '#0a0e13' || echo "Assets generation failed, skipping"
        bunx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Fix Kotlin Duplicate Classes
      run: |
        cat <<EOF >> android/app/build.gradle

        configurations.all {
            resolutionStrategy {
                exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
            }
        }
        EOF

    - name: Build APK
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fuel-track-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
