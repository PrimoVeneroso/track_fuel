name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm install --no-package-lock

    - name: Install Capacitor
      run: |
        npm install @capacitor/core @capacitor/android
        npm install -D @capacitor/cli

    - name: Build Web App
      run: npx next build

    - name: Initialize Capacitor
      run: |
        npx cap init "Fuel Track" "com.fueltrack.app" --web-dir out
        
    - name: Add Android Platform
      run: |
        npx cap add android

    - name: Generate Native Icons
      run: |
        npm install -g @capacitor/assets
        mkdir -p assets
        cp public/icons/icon-512.png assets/icon.png
        # Ignore splash screen for now, just generate icons
        npx @capacitor/assets generate --iconBackgroundColor '#0a0e13' --iconBackgroundColorDark '#0a0e13'
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Fix Kotlin Duplicate Classes
      run: |
        cat <<EOF >> android/app/build.gradle

        configurations.all {
            resolutionStrategy {
                exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
            }
        }
        EOF

    - name: Build APK
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fuel-track-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
