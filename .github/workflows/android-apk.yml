name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.0'

    - name: Install locked dependencies
      run: bun install --frozen-lockfile

    - name: Test and build web app
      run: |
        bun test tests/fuel
        bun run lint
        bun run build

    - name: Add Android platform
      run: bunx cap add android

    - name: Generate native icons and sync
      run: |
        mkdir -p assets
        cp public/icons/icon-512.png assets/icon.png
        bunx capacitor-assets generate --android --iconBackgroundColor '#0a0e13' --iconBackgroundColorDark '#0a0e13'
        bunx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Restore permanent signing key
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret $name mancante. Configura la firma permanente seguendo GUIDA_CAPACITOR.md. Non vengono generati APK con chiavi temporanee."
            exit 1
          fi
        done
        umask 077
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fueltrack.keystore"

    - name: Configure native export, version and signing
      env:
        ANDROID_VERSION_CODE: ${{ github.run_number }}
      run: node scripts/prepare-android.mjs

    - name: Build signed APK
      working-directory: android
      env:
        ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/fueltrack.keystore
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        chmod +x ./gradlew
        ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v6
      with:
        name: fuel-track-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error
